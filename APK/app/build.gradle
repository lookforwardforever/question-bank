plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zihan.questionbank'
    compileSdk 37

    defaultConfig {
        applicationId "com.zihan.questionbank"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/question-bank.jks")
            storePassword "QB-2026-Local-Key"
            keyAlias "questionbank"
            keyPassword "QB-2026-Local-Key"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }

    lint {
        abortOnError false
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
